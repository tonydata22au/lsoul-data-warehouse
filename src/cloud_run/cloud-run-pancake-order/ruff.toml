# Formatting and lint settings for this service. From the repo root:
#   uvx ruff@0.17.2 format src/cloud_run/cloud-run-pancake-order tests/test_cloud_run_pancake_order.py
#   uvx ruff@0.17.2 check src/cloud_run/cloud-run-pancake-order tests/test_cloud_run_pancake_order.py
line-length = 100
target-version = "py313"

[lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
